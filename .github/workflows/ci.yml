name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokenward
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tokenward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenward -d tokenward"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: ci-only-password

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -v